name: Packagist Deploy

# The repository has no Packagist webhook: this workflow is what tells Packagist about a new release
on:
  release:
    types: [ published ]

permissions: {}

jobs:
  update:

    runs-on: ubuntu-latest

    name: Update the package on Packagist

    steps:
      - name: Ask Packagist to update the package
        run: >-
          curl --fail-with-body --silent --show-error --request POST
          --header 'Content-Type: application/json'
          --data '{"repository":{"url":"https://packagist.org/packages/lomkit/laravel-access-control"}}'
          "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}"
        env:
          PACKAGIST_USERNAME: GautierDele
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
